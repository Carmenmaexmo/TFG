<div class="comentarios-wrapper">
  <h2>🗨️ Comentarios del Tema</h2>

  <div *ngIf="comentariosJerarquicos.length === 0" class="vacio">
    No hay comentarios aún en este tema.
  </div>

  <button class="btn-ir-abajo" (click)="scrollAbajo()">⬇ Ir abajo</button>

  <ng-container *ngFor="let comentario of comentariosJerarquicos">
    <ng-container *ngTemplateOutlet="comentarioTemplate; context: { $implicit: comentario, nivel: 0 }"></ng-container>
  </ng-container>

  <button class="btn-volver" (click)="volverAForo()">← Volver a temas</button>

  <div class="nuevo-comentario">
    <h4 *ngIf="comentarioPadreId">Respondiendo a <strong>{{ respuestaAUsuario }}</strong></h4>
    <textarea id="nuevo-comentario-textarea" [(ngModel)]="nuevoComentario" placeholder="Escribe tu comentario aquí..."></textarea>
    <button (click)="enviarComentario()">Enviar</button>
    <button *ngIf="comentarioPadreId" (click)="cancelarRespuesta()" class="cancelar">Cancelar respuesta</button>
  </div>

  <div *ngIf="contextMenuVisible" class="context-menu" [ngStyle]="{ top: contextMenuY + 'px', left: contextMenuX + 'px' }">
    <div (click)="responderComentario()">📝 Responder</div>
    <hr class="menu-separador" />
    <div *ngIf="puedeEditarComentario(comentarioContextual)" (click)="editarComentario()">✏️ Editar</div>
    <div *ngIf="puedeBorrarComentario(comentarioContextual)" (click)="borrarComentario()">🗑 Borrar mensaje</div>
  </div>

  <div id="scroll-final"></div>
  <button class="btn-ir-abajo" (click)="scrollAbajo()">⬇ Ir abajo</button>
</div>

<!-- TEMPLATE CON COLAPSO Y LIMITACIÓN DE INDENTACIÓN -->
<ng-template #comentarioTemplate let-comentario let-nivel="nivel">
 <div class="comentario" [attr.id]="'comentario-' + comentario.id" [style.--nivel]="nivel" (contextmenu)="onRightClick($event, comentario)">
    <div class="cabecera">
      <strong>👤 {{ comentario.usuario?.nombreUsuario || 'Usuario anónimo' }}</strong>
      <span class="fecha">{{ comentario.fechaComentario | date:'short' }}</span>
    </div>

    <div *ngIf="comentarioEditandoId === comentario.id">
      <textarea [(ngModel)]="comentarioEditadoTexto" class="editar-textarea"></textarea>
      <button (click)="guardarEdicionComentario()" class="guardar-btn">💾 Guardar</button>
      <button (click)="cancelarEdicion()" class="cancelar">Cancelar</button>
    </div>

    <div *ngIf="comentarioEditandoId !== comentario.id">
      <p class="contenido">{{ comentario.contenido }}</p>
    </div>

    <button *ngIf="comentario.respuestas?.length" (click)="toggleRespuestas(comentario)" class="toggle-btn">
      <span *ngIf="comentario.mostrarRespuestas">▲ Ocultar respuestas</span>
      <span *ngIf="!comentario.mostrarRespuestas">▼ Ver {{ comentario.respuestas.length }} respuestas</span>
    </button>

    <div *ngIf="comentario.mostrarRespuestas" class="subrespuestas">
      <ng-container *ngFor="let respuesta of comentario.respuestas">
        <ng-container *ngTemplateOutlet="comentarioTemplate; context: { $implicit: respuesta, nivel: (nivel < 1 ? nivel + 1 : 1) }"></ng-container>
      </ng-container>
    </div>
  </div>
</ng-template>
