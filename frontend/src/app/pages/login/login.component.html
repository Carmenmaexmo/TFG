<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card p-4 shadow" style="max-width: 400px; width: 100%;">
      <h3 class="text-center mb-4">Iniciar Sesión</h3>
  
      <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  
      <div class="mb-3">
        <label for="usuario" class="form-label">Usuario</label>
        <input [(ngModel)]="nombreUsuario" type="text" class="form-control" id="usuario" required />
      </div>
  
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input [(ngModel)]="password" type="password" class="form-control" id="password" required />
      </div>
  
      <div class="d-grid">
        <button (click)="login()" class="btn btn-dark">Entrar</button>
      </div>
    </div>
  </div>
