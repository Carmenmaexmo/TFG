<div class="foro-wrapper">
    <h2 class="foro-titulo">💬 {{ foro?.nombre }}</h2>
    <p class="foro-descripcion">{{ foro?.descripcion }}</p>
  
    <h3 class="temas-titulo">Temas en discusión</h3>

    <!-- Botón para mostrar el formulario -->
    <button class="btn-crear-tema" (click)="mostrarFormulario = !mostrarFormulario">
        ➕ Crear nuevo tema
    </button>
    
    <!-- Formulario para crear tema -->
    <div *ngIf="mostrarFormulario" class="form-crear-tema">
        <input type="text" [(ngModel)]="nuevoTema.titulo" placeholder="Título del tema">
        <textarea [(ngModel)]="nuevoTema.contenido" placeholder="Contenido del tema"></textarea>
        <button (click)="crearTema()">Publicar</button>
        <button class="cancelar" (click)="mostrarFormulario = false">Cancelar</button>
    </div>
  
    <div class="temas-lista">
        <div *ngFor="let tema of temas" class="tema-card">
            <h4>📝 {{ tema.titulo }}</h4>
            <p>{{ tema.contenido }}</p>
            <small>🟣 Publicado por <strong>{{ tema.usuario?.nombreUsuario || 'Usuario desconocido' }}</strong></small>
          
            <!-- ✅ Aquí sí puedes usar tema -->
            <a [routerLink]="['/temas', tema.id]">💬 Ver comentarios</a>
          </div>
          
    </div>
  
    <div *ngIf="temas.length === 0" class="sin-temas">
      <p>No hay temas en el foro todavía.</p>
    </div>
  </div>
